name: Build macOS Binary

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-cpu=native"

jobs:
  build:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        rust: [stable]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary (x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build release binary (aarch64 / Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Test binary runs (x86_64)
        run: ./target/x86_64-apple-darwin/release/llm-proxy --help

      - name: Test binary runs (aarch64)
        if: runner.arch == 'ARM64'
        run: ./target/aarch64-apple-darwin/release/llm-proxy --help

      - name: Create universal binary
        run: |
          mkdir -p target/universal/release
          lipo -create \
            -output target/universal/release/llm-proxy \
            target/x86_64-apple-darwin/release/llm-proxy \
            target/aarch64-apple-darwin/release/llm-proxy
          chmod +x target/universal/release/llm-proxy
        shell: bash

      - name: Test universal binary
        run: ./target/universal/release/llm-proxy --help

      - name: Upload universal binary as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llm-proxy-macos-universal
          path: target/universal/release/llm-proxy
          retention-days: 30

      - name: Upload x86_64 binary as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llm-proxy-macos-x86_64
          path: target/x86_64-apple-darwin/release/llm-proxy
          retention-days: 30

      - name: Upload aarch64 binary as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llm-proxy-macos-aarch64
          path: target/aarch64-apple-darwin/release/llm-proxy
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets
        run: |
          mkdir -p release
          mv artifacts/llm-proxy-macos-universal release/llm-proxy-macos-universal
          mv artifacts/llm-proxy-macos-x86_64 release/llm-proxy-macos-x86_64
          mv artifacts/llm-proxy-macos-aarch64 release/llm-proxy-macos-aarch64
          chmod +x release/*

      - name: Generate checksums
        run: |
          cd release
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/llm-proxy-macos-universal
            release/llm-proxy-macos-x86_64
            release/llm-proxy-macos-aarch64
            release/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}