name: Build Release Binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Set Cargo version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          cargo install cargo-edit --locked
          cargo set-version "$RELEASE_VERSION"

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Code Sign macOS binary
        if: matrix.target == 'aarch64-apple-darwin' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)
          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            rm -f "$CERT_PATH"
          }
          trap cleanup EXIT

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          printf '%s' "$MACOS_CERTIFICATE" | tr -d '[:space:]' | base64 -D > "$CERT_PATH"
          openssl pkcs12 -in "$CERT_PATH" -passin env:MACOS_CERTIFICATE_PWD -noout
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          codesign \
            --keychain "$KEYCHAIN_PATH" \
            --sign "com.ruicouto.codesign" \
            --identifier com.ruicouto.llm-proxy \
            --force \
            "target/${{ matrix.target }}/release/llm-proxy"

      - name: Smoke test binary (Unix)
        if: runner.os != 'Windows'
        run: ./target/${{ matrix.target }}/release/llm-proxy --help

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        run: .\target\${{ matrix.target }}\release\llm-proxy.exe --help

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          staging="llm-proxy-${{ matrix.name }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/llm-proxy" "$staging/llm-proxy"
          tar -czf "$staging.tar.gz" "$staging/llm-proxy"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "llm-proxy-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\llm-proxy.exe" "$staging\llm-proxy.exe"
          Compress-Archive -Path "$staging\llm-proxy.exe" -DestinationPath "$staging.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llm-proxy-${{ matrix.name }}
          path: llm-proxy-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          pattern: llm-proxy-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum llm-proxy-* > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/llm-proxy-*
            release/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
