[package]
name = "llm-proxy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "llm-proxy"
path = "src/main.rs"

[dependencies]
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server", "http1", "http2", "tokio"] }
http-body-util = "0.1"
hyper-rustls = "0.27"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
futures-util = "0.3"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
keyring = "4.1"
dirs = "5.0"
toml = "0.8"
dialoguer = "0.11"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4.3"
chrono = "0.4.45"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
