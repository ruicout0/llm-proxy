[package]
name = "llm-proxy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "llm-proxy"
path = "src/main.rs"

[dependencies]
hyper = { version = "0.14", features = ["full"] }
hyper-rustls = "0.24"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
futures-util = "0.3"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
keyring = "4.1"
dirs = "5.0"
toml = "0.8"
dialoguer = "0.11"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
rustls-pemfile = "1.0"
webpki-roots = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
