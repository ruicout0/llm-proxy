[package]
name = "llm-proxy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "llm-proxy"
path = "src/main.rs"

[dependencies]
hyper = { version = "0.14", features = ["full", "client", "server"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
clap = { version = "4.5", features = ["derive", "env"] }
keyring = "4.1"
plist = "1.3"
dirs = "5.0"
toml = "0.8"
dialoguer = "0.11"
