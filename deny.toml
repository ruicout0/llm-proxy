# cargo-deny configuration
# Checks licenses, bans, sources, and advisories

[advisories]
# Vulnerability database to use (default: rustsec)
db = "rustsec"
# Path to optional local advisory database
# db-path = "path/to/advisory-db"
# Ignore specific advisories by ID
# ignore = ["RUSTSEC-2023-0001"]
# Severity threshold for warnings (default: "warning")
# severity = "warning"

[licenses]
# Allow these licenses (SPDX identifiers)
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
]
# Deny these licenses
# deny = ["GPL-3.0-only"]
# Allow licenses by crate name (for exceptions)
# allow-by-crate = { "some-crate" = ["GPL-3.0-only"] }
# Require license information for all crates
# require-license = true

[bans]
# Deny specific crates
# deny = { name = "bad-crate" }
# Deny multiple versions of the same crate
# multiple-versions = true
# Allow multiple versions for these crates
# allow-multiple-versions = ["serde", "serde_json"]
# Skip checking for multiple versions in dev-dependencies
# skip-dev = true
# Skip checking for multiple versions in build-dependencies
# skip-build = true

[sources]
# Allow crates from these registries
# allow-registry = ["crates.io"]
# Allow crates from these git repositories
# allow-git = ["https://github.com/trusted-org"]
# Allow crates from these paths
# allow-path = ["../local-crate"]

[advisories]
# Check for yanked crates
# yanked = "warn"